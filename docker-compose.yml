version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: sentinelx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sentinelx
      POSTGRES_PASSWORD: sentinelx_secure_password_2026
      POSTGRES_DB: sentinelx_soc
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelx -d sentinelx_soc"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinelx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      - APP_MODE=demo
      - DATABASE_URL=postgresql://sentinelx:sentinelx_secure_password_2026@db:5432/sentinelx_soc
      - SECRET_KEY=sentinelx-soc-secret-key-super-secure-change-in-prod-2026
      - WAZUH_API_URL=https://wazuh.manager:55000
    ports:
      - "8000:8000"
    volumes:
      - ./sample_data:/app/sample_data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinelx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"

volumes:
  pgdata:
